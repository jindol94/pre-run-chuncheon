<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PRE-RUN 춘천마라톤</title>
<meta name="description" content="2026 춘천마라톤 풀코스를 러너 시점 3D로 미리 달려보세요. 구간별 고도·경사·급수 위치·예상 기온과 목표 기록별 페이스.">
<meta property="og:title" content="PRE-RUN 춘천마라톤">
<meta property="og:description" content="춘천마라톤 42.195km를 러너 시점 3D로 미리 달려보는 코스 가이드">
<meta property="og:type" content="website">
<meta name="theme-color" content="#edf2f3">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Layout: 한 화면 = 한 가지 질문. 코스 탭은 러너 시점이 주인공, 그 아래 고도 스트립 하나와 숫자 셋. 나머지는 탭으로 분리 */
:root{
  --bg:#edf2f3; --surface:#ffffff; --sunk:#e4ebed; --ink:#0e2730; --sub:#62757c; --faint:#9aabb0; --line:#d8e1e4;
  --accent:#e0306f; --accent-soft:#fde4ed; --lake:#2b78b0; --up:#e8661c; --down:#2b78b0; --ok:#1f8a5b; --sun:#e9a100;
  --shadow:0 1px 2px rgba(14,39,48,.06),0 8px 24px rgba(14,39,48,.06);
  --num:"Barlow Condensed","Noto Sans KR",system-ui,sans-serif;
  --kr:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --tabh:62px; --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a171c; --surface:#112329; --sunk:#0d1e24; --ink:#e9f1f3; --sub:#8ea3aa; --faint:#5d737a; --line:#1d343b;
  --accent:#ff5a92; --accent-soft:#3a1a27; --lake:#5aa9e0; --up:#ff8a3d; --down:#5aa9e0; --ok:#43c08a; --sun:#f5b82e;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a171c; --surface:#112329; --sunk:#0d1e24; --ink:#e9f1f3; --sub:#8ea3aa; --faint:#5d737a; --line:#1d343b;
  --accent:#ff5a92; --accent-soft:#3a1a27; --lake:#5aa9e0; --up:#ff8a3d; --down:#5aa9e0; --ok:#43c08a; --sun:#f5b82e;
  --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--kr);font-size:15px;line-height:1.5;letter-spacing:-.01em;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0;touch-action:manipulation;-webkit-user-select:none;user-select:none}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.n{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:0}
.sub{color:var(--sub)}
.label{font-size:12px;color:var(--sub);font-weight:500}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.top-in{max-width:1160px;margin:0 auto;padding-block:12px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px}
.title{font-weight:800;font-size:17px;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.title span{color:var(--accent)}
.sp{flex:1}
.tog{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px}
.tog button{border-radius:999px;padding:5px 11px;font-size:12.5px;color:var(--sub);font-weight:500}
.tog button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.dday{font-family:var(--num);font-weight:700;font-size:17px;color:var(--accent);white-space:nowrap}

main{max-width:1160px;margin:0 auto;padding-block:4px calc(var(--tabh) + 28px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.screen>*{min-width:0}
.panel{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
h2{font-size:20px;font-weight:800;letter-spacing:-.03em;margin:0;text-wrap:balance}

.course{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:960px){.course{grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);align-items:start}.course .right{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px)}}
.viewer{position:relative;border-radius:var(--r);overflow:hidden;background:#20323a;height:min(56vh,560px);min-height:300px}
.viewer canvas{display:block;width:100%;height:100%;touch-action:none;cursor:ew-resize}
.mapbox{position:absolute;inset:0;background:var(--surface);touch-action:none;cursor:crosshair}
.mapbox svg{width:100%;height:100%;display:block}
.vtop{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.vtop>*{pointer-events:auto}
.glass{background:rgba(9,22,28,.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;border-radius:14px}
.vkm{padding:6px 12px 7px;line-height:1}
.vkm b{font-family:var(--num);font-size:30px;font-weight:700}
.vkm small{font-size:12px;opacity:.75;margin-left:3px}
.vseg{font-size:12.5px;font-weight:700;margin-top:5px;letter-spacing:-.01em;white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
.mapmode .vseg{color:var(--sub)}
.vg{font-family:var(--num);font-weight:600;font-size:14px;margin-left:7px;padding-left:7px;border-left:1px solid rgba(255,255,255,.3);opacity:.9}
.vg.up{color:#ffb07a;opacity:1}.vg.dn{color:#9fd0ff;opacity:1}
.mapmode .vg{border-left-color:var(--line)}.mapmode .vg.up{color:var(--up)}.mapmode .vg.dn{color:var(--down)}
.vbtn{width:40px;height:40px;display:grid;place-items:center}
.vbtn svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mapmode .glass{background:var(--sunk);color:var(--ink)}
.mapmode .vbtn svg{stroke:var(--ink)}
.vbot{position:absolute;left:12px;right:12px;bottom:12px;display:flex;align-items:flex-end;gap:10px;pointer-events:none}
.vbot>*{pointer-events:auto}
.aidpill{padding:8px 12px;font-size:13px;line-height:1.25}
.aidpill b{font-family:var(--num);font-size:20px;font-weight:600;margin-right:4px}
.play{margin-left:auto;display:flex;align-items:center;gap:6px}
.speed{height:44px;padding:0 12px;font-family:var(--num);font-weight:600;font-size:17px}
.pbtn{width:56px;height:56px;border-radius:50%;background:var(--accent);display:grid;place-items:center;box-shadow:0 6px 20px rgba(224,48,111,.4)}
.pbtn i{display:block;width:0;height:0;border-style:solid;border-width:9px 0 9px 15px;border-color:transparent transparent transparent #fff;margin-left:4px}
.pbtn.on i{width:14px;height:18px;border:none;border-left:5px solid #fff;border-right:5px solid #fff;margin-left:0}
.mapmode .vbot .aidpill{display:none}
.gpill{position:absolute;top:62px;left:50%;transform:translateX(-50%);padding:7px 13px;font-size:13px;font-weight:500;white-space:nowrap;pointer-events:none;line-height:1.2}
.gpill b{font-family:var(--num);font-size:19px;font-weight:700;margin-right:4px}
.gpill.up{background:rgba(232,102,28,.88)}.gpill.down{background:rgba(43,120,176,.88)}
.mapmode .gpill{display:none}

.strip{padding:14px 14px 10px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:ew-resize}
.strip-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px}
.seg button{border-radius:999px;padding:5px 11px;font-size:12.5px;color:var(--sub);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.strip svg{display:block;width:100%;height:auto;overflow:visible}
svg text{font-family:var(--num);font-size:12px;fill:var(--faint)}
svg .lbl{font-family:var(--kr);font-size:11px;font-weight:500;fill:var(--sub)}
@media (max-width:440px){.longname{display:none}}
.legend{font-size:11.5px;color:var(--sub);display:flex;justify-content:space-between;margin-top:4px}

.quick{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.quick::-webkit-scrollbar{display:none}
.qb{flex:none;background:var(--surface);box-shadow:var(--shadow);border-radius:999px;padding:9px 14px;font-size:13.5px;font-weight:500;display:flex;gap:6px;align-items:center}
.qb .n{font-weight:700;font-size:16px;color:var(--accent)}
.qb:active{transform:scale(.97)}

.now{padding:20px;display:grid;gap:16px}
.now-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.bigkm{font-family:var(--num);font-weight:700;font-size:64px;line-height:.85;letter-spacing:-.01em}
.bigkm small{font-size:20px;font-weight:600;color:var(--sub);margin-left:4px}
.when{text-align:right;line-height:1.1}
.when b{font-family:var(--num);font-size:28px;font-weight:600;display:block}
.where{font-size:14px;font-weight:700;margin-top:-6px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.trio>div{padding:12px 0;display:grid;gap:2px}
.trio>div+div{padding-left:14px;border-left:1px solid var(--line)}
.trio .v{font-family:var(--num);font-size:30px;font-weight:600;line-height:1}
.trio .v small{font-size:15px;color:var(--sub);font-weight:500;margin-left:1px}
.minor{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--sub)}
.minor b{color:var(--ink);font-weight:700}
.dotk{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.tip{font-size:14.5px;line-height:1.55;padding-left:12px;border-left:3px solid var(--accent)}
.actions{display:flex;gap:8px}
.act{flex:1;text-align:center;text-decoration:none;background:var(--sunk);border-radius:12px;padding:11px 8px;font-size:13.5px;font-weight:700}
.act:hover{background:var(--accent-soft);color:var(--accent)}

.list{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.si{width:100%;text-align:left;background:var(--surface);box-shadow:var(--shadow);border-radius:16px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:4px 14px;align-items:center}
.si .km{font-family:var(--num);font-size:15px;font-weight:600;color:var(--sub)}
.si .nm{font-weight:700;font-size:15.5px}
.si .ds{font-size:13px;color:var(--sub);grid-column:1}
.si svg{grid-column:2;grid-row:1/4;width:96px;height:44px}
.si .gain{font-family:var(--num);font-size:15px;font-weight:600}
.si.hot .gain{color:var(--up)}
.hero{padding:22px 20px;display:grid;gap:18px}
.goal{display:flex;align-items:center;justify-content:center;gap:16px}
.goal button{width:46px;height:46px;border-radius:50%;background:var(--sunk);font-size:22px;font-weight:500}
.goal input{font-family:var(--num);font-size:56px;font-weight:700;width:4.2ch;text-align:center;border:none;background:transparent;color:var(--ink);padding:0;letter-spacing:0}
.presets{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.presets button{background:var(--sunk);border-radius:999px;padding:6px 12px;font-family:var(--num);font-size:16px;font-weight:600;color:var(--sub)}
.presets button[aria-pressed="true"]{background:var(--accent);color:#fff}
.three{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.three .v{font-family:var(--num);font-size:30px;font-weight:600;line-height:1.1}
.rows{display:grid}
.rw{display:grid;grid-template-columns:52px minmax(0,1fr) 56px 70px;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.rw:last-child{border-bottom:none}
.rw .n{font-size:18px;font-weight:600}
.rw .r{text-align:right}
.rw.hot .p{color:var(--up)}
.rw .tag{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pad{padding:18px 20px}
.hours{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;text-align:center}
.hr{padding:10px 0;border-radius:14px;display:grid;gap:4px;justify-items:center}
.hr.cur{background:var(--accent-soft)}
.hr .t{font-family:var(--num);font-size:26px;font-weight:600;line-height:1}
.hr svg{width:26px;height:26px;fill:none;stroke:var(--sub);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.hr.rain svg{stroke:var(--lake)}
.wear{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.wear li{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:baseline}
.wear .n{font-size:26px;font-weight:600}
.chk{display:grid;margin:0;padding:0;list-style:none}
.chk button{width:100%;display:flex;gap:12px;align-items:center;text-align:left;padding:13px 0;border-bottom:1px solid var(--line)}
.box{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center}
.box svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:2.6;opacity:0}
.chk [aria-checked="true"] .box{background:var(--ok);border-color:var(--ok)}
.chk [aria-checked="true"] .box svg{opacity:1}
.chk [aria-checked="true"] .tx{color:var(--faint);text-decoration:line-through}
.chk button{align-items:flex-start}
.chk .box{margin-top:1px}
.txw{display:grid;gap:2px;min-width:0}
.tx{font-size:15px;font-weight:500;line-height:1.4}
.cn{font-size:12.5px;color:var(--sub);line-height:1.5}
.chk [aria-checked="true"] .cn{color:var(--faint)}
.grp{font-size:12px;color:var(--accent);font-weight:700;padding-top:14px}
details.info{font-size:12.5px;color:var(--sub);padding:4px 4px 0}
details.info summary{cursor:pointer;list-style:none;font-weight:500}
details.info summary::-webkit-details-marker{display:none}
details.info p{margin:8px 0 0;line-height:1.6}
details.info a{color:var(--lake)}

.tabbar{position:fixed;z-index:24;left:0;right:0;bottom:0;background:color-mix(in oklab,var(--surface) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabh)}
.tabbar button{display:grid;place-items:center;align-content:center;gap:2px;font-size:11.5px;color:var(--faint);font-weight:500}
.tabbar button[aria-selected="true"]{color:var(--ink);font-weight:700}
.tabbar button[aria-selected="true"] svg{stroke:var(--accent)}
.tabbar svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;z-index:40;left:50%;transform:translate(-50%,8px);top:calc(env(safe-area-inset-top,0px) + 62px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@media (max-width:420px){.bigkm{font-size:56px}.trio .v{font-size:26px}.goal input{font-size:48px}}
</style>
</head>
<body>


<header class="top"><div class="top-in">
  <div class="title"><span class="n" style="font-size:20px;font-weight:700;letter-spacing:.02em;margin-right:5px">PRE-RUN</span>춘천마라톤</div>
  <div class="sp"></div>
  <div class="tog" role="group" aria-label="종목"><button id="cFull" aria-pressed="true">풀</button><button id="c10k" aria-pressed="false">10K</button></div>
  <span class="dday" id="dday">D-4</span>
</div></header>

<main>
 <section class="screen" id="s-course">
  <div class="course">
   <div class="screen">
    <div class="viewer" id="viewer">
      <canvas id="scene" aria-label="러너 시점 가상 주행. 좌우로 드래그해 이동"></canvas>
      <div class="mapbox" id="mapbox" hidden><svg id="map" preserveAspectRatio="xMidYMid meet" aria-label="코스 지도"></svg></div>
      <div class="vtop">
        <div class="glass vkm"><b id="vkm">0.0</b><small>km</small><div class="vseg" id="vseg"></div></div>
        <button class="glass vbtn" id="vToggle" aria-label="코스 지도로 보기"><svg viewBox="0 0 24 24" id="vIcon"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg></button>
      </div>
      <div class="glass gpill" id="gpill" hidden></div>
      <div class="vbot">
        <div class="glass aidpill" id="aidpill"></div>
        <div class="play"><button class="glass speed" id="speed" aria-label="재생 배속">×5</button><button class="pbtn" id="play" aria-label="레이스 재생"><i></i></button></div>
      </div>
    </div>
    <div class="panel strip" id="strip" tabindex="0" role="slider" aria-label="코스 위치" aria-valuemin="0" aria-valuemax="42.195" aria-valuenow="0">
      <div class="strip-h"><span class="label">고도</span><div class="seg" id="layer"></div></div>
      <svg id="chart"></svg>
      <div class="legend" id="legend"></div>
    </div>
    <div class="quick" id="quick"></div>
   </div>
   <div class="right screen">
    <div class="panel now" id="now"></div>
    <details class="info"><summary>ⓘ 이 화면의 데이터</summary><p id="infoCourse"></p></details>
   </div>
  </div>
 </section>

 <section class="screen" id="s-segs" hidden>
  <h2 style="padding:6px 2px 0" id="segTitle">구간</h2>
  <ul class="list" id="seglist"></ul>
 </section>

 <section class="screen" id="s-pace" hidden>
  <div class="panel hero">
    <div class="label" style="text-align:center">목표 기록</div>
    <div class="goal"><button id="minus" aria-label="1분 줄이기">−</button><input id="target" value="4:00" inputmode="numeric" aria-label="목표 기록 h:mm"><button id="plus" aria-label="1분 늘리기">+</button></div>
    <div class="presets" id="presets"></div>
    <div class="three"><div><div class="v" id="avg">–</div><div class="label">평균 /km</div></div><div><div class="v" id="half">–</div><div class="label" id="halfLabel">하프</div></div><div><div class="v" id="fin">–</div><div class="label">골인 시각</div></div></div>
  </div>
  <div class="panel pad">
    <h2 style="margin-bottom:4px">5km 스플릿</h2>
    <div class="rows" id="splits"></div>
  </div>
 </section>

 <section class="screen" id="s-prep" hidden>
  <div class="panel pad" style="display:grid;gap:16px">
    <div><div class="label" id="wxLabel"></div><h2 id="wxHead"></h2></div>
    <div class="hours" id="hours"></div>
  </div>
  <div class="panel pad" style="display:grid;gap:14px">
    <h2>입을 옷</h2>
    <ul class="wear" id="wear"></ul>
  </div>
  <div class="panel pad">
    <div style="display:flex;justify-content:space-between;align-items:baseline"><h2>준비물</h2><span class="n sub" style="font-size:18px" id="prog"></span></div>
    <ul class="chk" id="chk"></ul>
  </div>
  <details class="info"><summary>ⓘ 출처</summary><p id="sources"></p></details>

let playing=false,raf=0,last=0,speed=5;const SPEEDS=[5,10,50];
function frame(t){if(!playing)return;const dt=Math.min(.1,(t-last)/1000);last=t;tAnim+=dt;const nt=timeAt(pos)+dt*speed;if(nt>=total){setPos(FULL);stop();toast(`골인 ${clock(total)}`);return}
 const prev=pos;setPos(kmAtTime(nt));const cr=AID.find(a=>a[0]>prev&&a[0]<=pos);if(cr)toast(`${cr[0]}km ${cr[1]}`);raf=requestAnimationFrame(frame)}
function start(){if(pos>=FULL-.01)setPos(0);playing=true;last=performance.now();$("#play").classList.add("on");$("#play").setAttribute("aria-label","일시정지");raf=requestAnimationFrame(frame)}
function stop(){if(!playing)return;playing=false;cancelAnimationFrame(raf);$("#play").classList.remove("on");$("#play").setAttribute("aria-label","레이스 재생");setPos(pos)}
bindTap($("#play"),()=>playing?stop():start());
bindTap($("#speed"),()=>{speed=SPEEDS[(SPEEDS.indexOf(speed)+1)%SPEEDS.length];$("#speed").textContent="×"+speed;toast(`완주까지 약 ${total/speed>=120?Math.round(total/speed/60)+"분":Math.round(total/speed)+"초"}`)});


function spark(s){const w=96,h=44,pts=[];for(let k=s.a;k<=s.b+.001;k+=(s.b-s.a)/40)pts.push([(k-s.a)/(s.b-s.a)*w,h-3-(elevAt(k)-EMIN)/(EMAX-EMIN)*(h-6)]);const l=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1)).join("");return `<svg viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${l}L${w},${h}L0,${h}Z" fill="var(--sunk)"/><path d="${l}" fill="none" stroke="${s.gain>C.hot?"var(--up)":"var(--faint)"}" stroke-width="2"/></svg>`}
function renderSegs(){$("#seglist").innerHTML=SEGS.map((s,i)=>`<li><button class="si ${s.gain>C.hot?"hot":""}" data-i="${i}"><span class="km">${s.a}–${s.b===FULL?FULL.toFixed(1):s.b} km · ${clock(timeAt(s.a))}</span><span class="nm">${s.name}</span><span class="ds">${s.d} · <span class="gain">+${Math.round(s.gain)}m</span></span>${spark(s)}</button></li>`).join("");
 document.querySelectorAll(".si").forEach(b=>b.onclick=()=>{showTab("course");setPos(SEGS[+b.dataset.i].a+.02)})}

const save=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},load=k=>{try{return localStorage.getItem(k)}catch(e){return null}};

function setTotal(s){total=clamp(s,C.range[0],C.range[1]);setTimeout(renderCheck,0);$("#target").value=hm(total);save("cc3-target-"+courseKey,String(total));buildPace();renderPace();renderSegs();drawRibbon();setPos(pos);renderPrep()}
$("#target").addEventListener("change",()=>{const s=parse($("#target").value);if(s&&s>=C.range[0]&&s<=C.range[1])setTotal(s);else{$("#target").value=hm(total);toast(`${hm(C.range[0])}–${hm(C.range[1])} 사이로 입력하세요`)}});
$("#minus").onclick=()=>setTotal(total-60);$("#plus").onclick=()=>setTotal(total+60);
function renderPace(){
 $("#presets").innerHTML=C.presets.map(v=>`<button aria-pressed="${v===total}" data-v="${v}">${hm(v)}</button>`).join("");$("#presets").querySelectorAll("button").forEach(b=>b.onclick=()=>setTotal(+b.dataset.v));
 $("#avg").textContent=fmt(total/FULL,false);$("#half").textContent=courseKey==="full"?hm(timeAt(21.0975)):fmt(timeAt(FULL/2),false);$("#halfLabel").textContent=courseKey==="full"?"하프":"5K";$("#fin").textContent=clock(total);
 const pts=C.splits.map(x=>x==="F"?FULL:x);let prev=0;
 $("#splits").innerHTML=pts.map(b=>{const a=prev;prev=b;const t=timeAt(b)-timeAt(a),pace=t/(b-a),hot=pace>total/FULL+4;const aid=AID.find(x=>x[0]===b);
  return `<div class="rw ${hot?"hot":""}"><span class="n">${b===FULL?"골인":b+"K"}</span><span class="tag">${aid?aid[1]:""}</span><span class="n r p">${fmt(pace,false)}</span><span class="n r sub" style="font-size:16px">${fmt(timeAt(b))}</span></div>`}).join("");
}
const WICON={cloud:'<path d="M7 18a4 4 0 010-8 5 5 0 019.6 1.5A3.5 3.5 0 0117 18z"/>',rain:'<path d="M7 15a4 4 0 010-8 5 5 0 019.6 1.5A3.5 3.5 0 0117 15z"/><path d="M9 18l-1 2M13 18l-1 2M17 18l-1 2"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/>'};
function renderPrep(){
 const end=RACE.startH+total/3600;
 $("#hours").innerHTML=HOURS.slice(0,6).map(([h,t,,r])=>{const k=clear?"sun":r>.2?"rain":"cloud";return `<div class="hr ${h<end?"cur":""} ${k==="rain"?"rain":""}"><span class="label">${h}시</span><svg viewBox="0 0 24 24">${WICON[k]}</svg><span class="t">${t}°</span></div>`}).join("");
 const st=cond(0),dam=cond(C.mid[0]),fin=cond(FULL),rainy=!clear&&fin.rain>.2;
 $("#wear").innerHTML=[[st.feel,"출발",st.feel<10?"긴팔 위에 버릴 옷":"싱글렛+암슬리브, 버릴 옷 하나"],[dam.feel,C.mid[1],`${clock(dam.tSec)} 통과, ${C.mid[2]}`],[fin.feel,"골인",rainy?"비 가능, 캡 모자와 우의":"모자 하나면 충분"]].map(([f,w,t])=>`<li><span class="n">${Math.round(f)}°</span><span><b>${w}</b> <span class="sub">${t}</span></span></li>`).join("");
}
let done=[];const ckey=()=>"cc3-check3-"+courseKey;
function checkList(){return CHECK.map((c,i)=>({w:c[0],t:c[1],n:c[2]||"",only:c[3],i})).filter(c=>!c.only||c.only===courseKey)}
function fillT(x){return x.replace(/\{c:([\d.]+)\}/g,(m,k)=>fmt(timeAt(+k))).replace(/\{t:([\d.]+)\}/g,(m,k)=>+k<=FULL?clock(timeAt(+k)):"").replace("{fin}",clock(total))}
let doneKey="",doneMem={};
function renderCheck(){const k=ckey();if(doneKey!==k){if(doneKey)doneMem[doneKey]=done;doneKey=k;if(doneMem[k])done=doneMem[k];else{try{done=JSON.parse(load(k)||"[]")}catch(e){done=[]}}}const L=checkList();let g="";
 $("#chk").innerHTML=L.map(c=>{const head=c.w!==g?`<li class="grp">${c.w}</li>`:"";g=c.w;return head+`<li><button role="checkbox" aria-checked="${done.includes(c.i)}" data-i="${c.i}"><span class="box"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></span><span class="txw"><span class="tx">${c.t}</span>${c.n?`<span class="cn">${fillT(c.n)}</span>`:""}</span></button></li>`}).join("");
 $("#prog").textContent=`${L.filter(c=>done.includes(c.i)).length}/${L.length}`;document.querySelectorAll("#chk button").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;done=done.includes(i)?done.filter(x=>x!==i):[...done,i];save(ckey(),JSON.stringify(done));renderCheck()})}

const TABS=["course","segs","pace","prep"];let currentTab="course";
function showTab(t){currentTab=t;TABS.forEach(k=>$("#s-"+k).hidden=k!==t);document.querySelectorAll(".tabbar button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t));if(t!=="course")stop();window.scrollTo(0,0);if(t==="course"){resize();setPos(pos)}}
document.querySelectorAll(".tabbar button").forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
if(TABS.includes(location.hash.slice(1)))currentTab=location.hash.slice(1);
(()=>{const d=Math.ceil((new Date(RACE.startISO)-new Date())/864e5);$("#dday").textContent=d>0?`D-${d}`:d===0?"D-DAY":"완주!"})();
let courseKey="full";
function setCourse(k){stop();courseKey=k;build(k);if(GL)glBuildWorld();$("#cFull").setAttribute("aria-pressed",k==="full");$("#c10k").setAttribute("aria-pressed",k==="10k");
 const sv=+load("cc3-target-"+k);total=sv>=C.range[0]&&sv<=C.range[1]?sv:C.def;$("#target").value=hm(total);
 $("#segTitle").textContent=`${SEGS.length}개 구간 · ${C.label}`;$("#infoCourse").innerHTML=C.info.replace("2.5배",EXG.toFixed(1)+"배");ELEVMETA=`고저차 ${Math.round(RELIEF)}m · 누적 +${Math.round(GAIN)}m`;
 buildPace();drawChart();drawMap();renderQuick();renderPace();renderSegs();renderPrep();renderCheck();setPos(0);if(viewMode==="run")resize();else moveMapDot()}
$("#cFull").onclick=()=>{if(courseKey!=="full"){setCourse("full");toast(`풀코스 · ${C.start} 출발`)}};$("#c10k").onclick=()=>{if(courseKey!=="10k"){setCourse("10k");toast(`10K · ${C.start} 출발`)}};
$("#wxLabel").textContent=RACE.wxLabel;$("#wxHead").textContent=RACE.wxHead;$("#sources").innerHTML=RACE.sources;
if(Object.keys(COURSES).length<2)$(".tog").hidden=true;renderLayer();setCourse(location.hash==="#10k"?"10k":"full");showTab(TABS.includes(location.hash.slice(1))?location.hash.slice(1):"course");
if(document.fonts)document.fonts.ready.then(()=>drawScene());
</script>

</body>
